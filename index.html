<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crunch Week: see your crunch weeks coming</title>
  <meta name="description" content="Paste your syllabi, see your crunch weeks coming, and find your textbooks free.">
  <meta name="theme-color" content="#faf8f4">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23faf8f4'/%3E%3Crect x='4' y='4' width='7' height='11' rx='2' fill='%23f2c4bb'/%3E%3Crect x='12.5' y='4' width='7' height='11' rx='2' fill='%23e05a44'/%3E%3Crect x='21' y='4' width='7' height='11' rx='2' fill='%23f2c4bb'/%3E%3Crect x='4' y='17' width='7' height='11' rx='2' fill='%23ea9283'/%3E%3Crect x='12.5' y='17' width='7' height='11' rx='2' fill='%23f6dcd6'/%3E%3Crect x='21' y='17' width='7' height='11' rx='2' fill='%23ea9283'/%3E%3C/svg%3E">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Crunch Week">
  <meta property="og:description" content="Paste your syllabi, see your crunch weeks coming, and find your textbooks free.">
  <meta property="og:url" content="https://hayobro7512.github.io/crunch-week/">
  <meta property="og:image" content="https://hayobro7512.github.io/crunch-week/docs/screenshot.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    { "imports": { "chrono-node": "https://cdn.jsdelivr.net/npm/chrono-node@2.7.7/+esm" } }
  </script>
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <header>
    <h1>Crunch Week</h1>
    <p class="tag">Paste your syllabi. See your crunch weeks coming. Find your textbooks free.</p>
  </header>

  <main>
    <section class="input">
      <label for="syllabi">Your syllabi</label>
      <textarea id="syllabi" rows="12" placeholder="Paste one or more syllabi here: course name on top, then the schedule and deadlines."></textarea>
      <div class="actions">
        <button id="sample" type="button" class="ghost">Load sample</button>
        <button id="unpack" type="button">Unpack my semester</button>
        <span id="status" role="status"></span>
      </div>
    </section>

    <section id="results" hidden>
      <div id="callout" class="callout"></div>
      <h2>Your semester, week by week</h2>
      <div id="heatmap" class="heatmap" aria-label="Weeks colored by workload"></div>
      <p class="legend" aria-hidden="true">Lighter week <i></i> Heavier week</p>
      <ol id="weeks" class="weeks"></ol>
      <div class="actions"><button id="ics" type="button" class="ghost">Add to calendar (.ics)</button></div>

      <h2>Textbooks</h2>
      <div id="books" class="books"></div>
    </section>
  </main>
</body>
</html>
