# Copy to .github/workflows/pages.yml for a static front end.
# Deploys DIST_DIR on every push to main. Needs a public repo (or a paid plan) and
# Settings > Pages > Source: GitHub Actions, both done only with the human's yes.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: if [ -f package.json ]; then npm ci && npm run build --if-present; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
